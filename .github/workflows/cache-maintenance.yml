name: Cache maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '47 5 * * *'
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: cache-maintenance
  cancel-in-progress: false

jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Never execute a script or artifact from the workflow that triggered us.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Retention policy regressions
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Reclaim closed refs and old main generations
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/cache_retention.py --apply
