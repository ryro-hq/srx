name: Dependency security
on:
  workflow_call:
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      - name: Validate time-bounded policy exceptions
        run: cargo xtask security exceptions
