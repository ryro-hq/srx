name: Security analysis
on:
  workflow_call:
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          output: sarif-results
          upload: false
      - name: Reject incomplete analysis and high or critical findings
        env:
          LANGUAGE: ${{ matrix.language }}
        run: cargo xtask security sarif sarif-results "$LANGUAGE"
      - name: Upload analysis from the same scanned revision
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: sarif-results
          category: ${{ matrix.language }}
      - name: Preserve raw analysis evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: error
  dependency-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      - name: Validate time-bounded policy exceptions
        run: cargo xtask security exceptions
