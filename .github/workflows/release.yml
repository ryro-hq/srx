name: Core release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: core-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admit:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.admit.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Admit only a matching SemVer tag from qualified main
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "syrox") | .version')
          test "$TAG" = "v$version"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .head_branch == "main" and .conclusion == "success")][0].id')
          [[ "$run" =~ ^[0-9]+$ ]]
          echo "run=$run" >> "$GITHUB_OUTPUT"
  prepare:
    needs: admit
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.admit.outputs.run }}
          name: release-${{ matrix.target }}
          path: payload
      - name: Reverify and pack the qualified bytes, licenses and evidence
        env:
          TARGET: ${{ matrix.target }}
        run: |
          (cd payload && sha256sum --check SHA256SUMS)
          cp payload/sbom.spdx.json "srx-$TARGET.spdx.json"
          tar -czf "srx-$TARGET.tar.gz" -C payload .
          sha256sum "srx-$TARGET.tar.gz" > "srx-$TARGET.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: publish-${{ matrix.target }}
          path: srx-*
          if-no-files-found: error
  publish:
    needs: [admit, prepare]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: publish-*
          merge-multiple: true
          path: release
      - name: Reverify publication inputs
        run: (cd release && sha256sum --check ./*.sha256)
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*.tar.gz
      - name: Bind GNU SPDX inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/srx-x86_64-unknown-linux-gnu.tar.gz
          sbom-path: release/srx-x86_64-unknown-linux-gnu.spdx.json
      - name: Bind musl SPDX inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/srx-x86_64-unknown-linux-musl.tar.gz
          sbom-path: release/srx-x86_64-unknown-linux-musl.spdx.json
      - name: Verify signer identity and publish immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = true
          gh attestation trusted-root > release/trusted_root.jsonl
          for artifact in release/*.tar.gz; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA"
            (cd release && gh attestation download "${artifact#release/}" --repo "$GITHUB_REPOSITORY")
            digest=$(sha256sum "$artifact" | cut -d' ' -f1)
            for predicate in https://slsa.dev/provenance/v1 https://spdx.dev/Document; do
              gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
                --bundle "release/sha256:$digest.jsonl" --custom-trusted-root release/trusted_root.jsonl \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-digest "$GITHUB_SHA" --predicate-type "$predicate" --deny-self-hosted-runners
            done
          done
          gh release create "$TAG" --verify-tag --target "$GITHUB_SHA" --draft \
            --title "$TAG" --generate-notes release/*
          gh release edit "$TAG" --draft=false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)" = true
