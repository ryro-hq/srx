name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/cargo
  RUST_BACKTRACE: '1'

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.changes.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo 'heavy=true' >> "$GITHUB_OUTPUT"
          else
            cargo xtask ci classify "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
            cargo xtask ci commits "$BASE_SHA" "$HEAD_SHA"
          fi
  fuzz:
    uses: ./.github/workflows/fuzz.yml
    permissions:
      contents: read
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
  workflow-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install authenticated workflow linter
        run: |
          cargo xtask security tools --output "$RUNNER_TEMP/srx-tools" --tool workflows
          echo "$RUNNER_TEMP/srx-tools" >> "$GITHUB_PATH"
      - run: cargo xtask security workflows
  quality:
    needs: [changes, build]
    if: always() && needs.changes.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: quality
      - name: Format and module layout
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2024 --check tests/fixtures/stalled-test.rs
          cargo xtask structure
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.changes.outputs.heavy == 'true'
        with:
          name: release-x86_64-unknown-linux-gnu
          path: target/ci-candidates
      - name: Check maintained sources with the authenticated candidate
        if: needs.changes.outputs.heavy == 'true'
        env:
          SRX: ${{ github.workspace }}/target/ci-candidates/srx
        run: |
          chmod 700 "$SRX"
          cargo xtask check
      - name: Rustdoc and examples
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --locked --all-features --no-deps --document-private-items
          cargo test --workspace --locked --all-features --doc

  clippy:
    name: clippy (${{ matrix.features }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features: [all-features, no-default-features]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: clippy-${{ matrix.features }}
      - name: Check all targets
        env:
          FEATURES: ${{ matrix.features }}
        run: cargo clippy --workspace --all-targets --locked "--$FEATURES" -- -D warnings

  portable-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: host-tests
          save-cache: 'false'
      - name: Language and CLI tests
        run: cargo xtask test --suite portable

  build:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]
    env:
      TARGET: ${{ matrix.target }}
      RUSTFLAGS: -C target-feature=+crt-static
      LZMA_API_STATIC: '1'
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install toolchain and native link tools
        run: |
          rustup show active-toolchain
          rustup target add "$TARGET"
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/; s|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          compiler_major=$(gcc -dumpversion)
          [[ "$compiler_major" =~ ^[0-9]+$ ]]
          sudo apt-get install -y musl-tools liblzma-dev pkg-config libc6-dev "libgcc-$compiler_major-dev"
      - uses: ./.github/actions/rust
        with:
          cache-key: release-${{ matrix.target }}
      - name: Build worker before CLI
        run: |
          cargo build --release --locked -p syrox --bin syrox-worker --target "$TARGET"
          SYROX_EMBED_WORKER="$CARGO_TARGET_DIR/$TARGET/release/syrox-worker" \
            cargo build --release --locked -p syrox --bin srx --target "$TARGET"
      - name: Verify release and bind its source identity
        run: |
          RUSTFLAGS="" cargo run --locked -p syrox-engine --example verify_release -- "$CARGO_TARGET_DIR/$TARGET/release"
          mkdir -p "target/candidates/$TARGET"
          cp "$CARGO_TARGET_DIR/$TARGET/release/srx" "$CARGO_TARGET_DIR/$TARGET/release/syrox-worker" "target/candidates/$TARGET/"
          RUSTFLAGS="" cargo run --locked -p syrox-engine --example ci_candidates -- "$PWD/target/candidates/$TARGET" "$TARGET"
      - name: Install the digest-pinned vulnerability scanner
        run: |
          RUSTFLAGS='' cargo xtask security tools --output "$RUNNER_TEMP/release-tools" --tool grype
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - name: Bind SPDX, native licenses and vulnerability evidence to the candidate
        run: RUSTFLAGS='' cargo xtask release core "target/candidates/$TARGET" "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: target/candidates/${{ matrix.target }}/**
          if-no-files-found: error

  vm-environment:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SYROX_VM_CONFIG: ${{ github.workspace }}/target/environment-config.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: host-tests
      - name: Require KVM and Docker
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 660 /dev/kvm
          docker info
      - name: Restore pinned VM environment
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: environment-cache
        with:
          path: |
            target/ci-environment
            target/vm-runtime
          key: vm-linux-6.12.109-sdk-0.7.3-${{ hashFiles('tests/vm/*.Containerfile', 'crates/syrox/tests/vm_support/prepare.rs') }}
      - name: Build pinned guest and firmware
        if: steps.environment-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p target/ci-environment
          docker build --iidfile target/ci-environment/image.id \
            --build-arg RUST_IMAGE=rust@sha256:4cd829461bd5c4d511c32e269da9cb8929223b666519d8004e35fc8d1d771ab7 \
            --build-arg BASE_IMAGE=debian@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f \
            -f tests/vm/guest.Containerfile -t syrox-vm:ci tests/vm
          docker save --output target/ci-environment/image.tar syrox-vm:ci
          cargo test --locked -p syrox --test vm -- --prepare --install-runtime --build-firmware \
            --image-archive "$PWD/target/ci-environment/image.tar" \
            --preparation-image "$(cat target/ci-environment/image.id)"
      - name: Publish verified runtime inputs
        env:
          CACHE_HIT: ${{ steps.environment-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then
            (cd target/ci-environment && sha256sum -c SHA256SUMS)
          fi
          cp target/vm-runtime/bin/msb target/ci-environment/msb
          cp target/vm-runtime/landlock/libkrunfw.so.5.6.1 target/ci-environment/firmware.so
          cp target/vm-runtime/landlock/provenance.json target/ci-environment/provenance.json
          jq -e '.kernel == "6.12.109" and .sdk == "0.7.3"' target/ci-environment/provenance.json
          test "$(sha256sum target/ci-environment/firmware.so | cut -d' ' -f1)" = "$(jq -r .firmware_sha256 target/ci-environment/provenance.json)"
          cd target/ci-environment
          sha256sum msb firmware.so image.tar image.id provenance.json > SHA256SUMS
      - name: Save verified VM environment on the default branch
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.environment-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target/ci-environment
            target/vm-runtime
          key: ${{ steps.environment-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vm-linux-6.12.109
          path: target/ci-environment/*
          if-no-files-found: error
          compression-level: 1

  kernel:
    name: kernel (${{ matrix.profile }}, ${{ matrix.target }}, ${{ matrix.kernel }})
    needs: [build, vm-environment]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: native
            target: x86_64-unknown-linux-gnu
            kernel: '6.12.109'
          - profile: acceptance
            target: x86_64-unknown-linux-gnu
            kernel: '6.12.109'
          - profile: acceptance
            target: x86_64-unknown-linux-musl
            kernel: '6.12.109'
    env:
      PROFILE: ${{ matrix.profile }}
      KERNEL: ${{ matrix.kernel }}
      SYROX_VM_CONFIG: ${{ github.workspace }}/target/ci-vm-config.json
      SYROX_VM_EVIDENCE: ${{ github.workspace }}/target/test-evidence/ci-vm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: host-tests
          save-cache: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-${{ matrix.target }}
          path: target/ci-candidates
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vm-linux-${{ matrix.kernel }}
          path: target/ci-environment
      - name: Check pinned environment and require KVM
        run: |
          (cd target/ci-environment && sha256sum -c SHA256SUMS)
          jq -e --arg kernel "$KERNEL" '.kernel == $kernel' target/ci-environment/provenance.json
          chmod 700 target/ci-environment/msb target/ci-candidates/srx target/ci-candidates/syrox-worker
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 660 /dev/kvm
          docker load --input target/ci-environment/image.tar
      - name: Restore guest preparation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: preparation-cache
        with:
          path: |
            target/vm-cache/vendor
            target/vm-cache/guest/target
          key: vm-prepare-v1-${{ runner.os }}-${{ hashFiles('target/ci-environment/image.id', 'Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'crates/**', 'std/**', 'tests/fixtures/**') }}
          restore-keys: |
            vm-prepare-v1-${{ runner.os }}-${{ hashFiles('target/ci-environment/image.id', 'Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Configure the explicit resource profile and imported candidates
        run: |
          cargo test --locked -p syrox --test vm -- --prepare \
            --runtime "$PWD/target/ci-environment/msb" \
            --firmware "$PWD/target/ci-environment/firmware.so" \
            --image-archive "$PWD/target/ci-environment/image.tar" \
            --preparation-image "$(cat target/ci-environment/image.id)" \
            --profile "$PROFILE" --candidate-bundle "$PWD/target/ci-candidates"
      - name: Run complete kernel suite or eight minimum-environment gates
        run: |
          if [ "$PROFILE" = native ]; then
            cargo test --locked -p syrox --test vm -- --suite native
          else
            cargo test --locked -p syrox --test vm
          fi
      - name: Check compilation cache is inactive
        if: always()
        id: inactive-cache
        run: |
          if test -f target/test-evidence/ci-vm/report.json && \
            jq -e '.vm_cleanup == "not-started" or .vm_cleanup == "confirmed absent" or (.vm_cleanup | startswith("destroyed;"))' target/test-evidence/ci-vm/report.json >/dev/null; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save settled preparation from the default branch's native lane
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.profile == 'native' && steps.inactive-cache.outputs.save == 'true' && steps.preparation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target/vm-cache/vendor
            target/vm-cache/guest/target
          key: ${{ steps.preparation-cache.outputs.cache-primary-key }}
      - name: Preserve kernel evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kernel-${{ matrix.profile }}-${{ matrix.target }}-${{ matrix.kernel }}
          if-no-files-found: warn
          path: |
            target/test-evidence/ci-vm/**/*.log
            target/test-evidence/ci-vm/**/*.json
            target/test-evidence/ci-vm/**/*.jsonl
            target/test-evidence/ci-vm/**/*.tar
            target/ci-vm-config.json
            target/vm-doctor.json

  verify:
    if: always()
    needs: [changes, quality, clippy, portable-tests, build, vm-environment, kernel, security, workflow-policy, fuzz]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks, including SAST and VM qualification
        env:
          NEEDS: ${{ toJson(needs) }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
        run: |
          jq --exit-status --arg heavy "$HEAVY" '
            to_entries | all(
              if (.key == "build" or .key == "vm-environment" or .key == "kernel") and $heavy == "false"
              then .value.result == "skipped"
              else .value.result == "success" end
            )' <<< "$NEEDS"
  # Keep the old required context until GitHub rules require verify.
  success:
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
