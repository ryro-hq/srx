name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Format
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2024 --check tools/check_structure.rs
      - name: Rust module layout and crate docs
        run: |
          rustc --edition 2024 -D warnings tools/check_structure.rs -o /tmp/syrox-check-structure
          rustc --edition 2024 -D warnings --test tools/check_structure.rs -o /tmp/syrox-check-structure-tests
          /tmp/syrox-check-structure-tests
          /tmp/syrox-check-structure
      - name: Rustdoc and examples
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --locked --all-features --no-deps --document-private-items
          RUSTDOCFLAGS="-D warnings" cargo test --workspace --locked --all-features --doc
      - name: Test native subset
        run: cargo test --workspace --locked --no-default-features
      - name: Clippy all targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy without default features
        run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  microvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SYROX_VM_EVIDENCE: ${{ github.workspace }}/target/test-evidence/ci-vm
      SYROX_VM_CONFIG: ${{ github.workspace }}/target/ci-vm-config.json
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Require KVM and Docker
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 660 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          docker info
      - name: Build guest and preparation image
        run: |
          mkdir -p target
          docker build --iidfile target/ci-vm-image.id \
            --build-arg RUST_IMAGE=rust@sha256:4cd829461bd5c4d511c32e269da9cb8929223b666519d8004e35fc8d1d771ab7 \
            --build-arg BASE_IMAGE=debian@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f \
            -f tests/vm/Containerfile -t syrox-vm:ci tests/vm
          docker save --output target/ci-vm-image.tar syrox-vm:ci
      - name: Prepare pinned runtime and Landlock firmware
        run: |
          cargo test --locked -p syrox --test vm -- --prepare \
            --install-runtime --build-firmware \
            --image-archive "$PWD/target/ci-vm-image.tar" \
            --preparation-image "$(cat target/ci-vm-image.id)"
      - name: Run eight default VM gates
        run: cargo test --locked -p syrox --test vm
      - name: Preserve VM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: microvm-evidence
          if-no-files-found: warn
          path: |
            target/test-evidence/ci-vm/report.json
            target/test-evidence/ci-vm/guest-report.json
            target/test-evidence/ci-vm/**/*.log
            target/test-evidence/ci-vm/**/*.json
            target/test-evidence/ci-vm/**/*.jsonl
            target/test-evidence/ci-vm/**/*.tar
            target/firmware-evidence/**
            target/vm-runtime/landlock/provenance.json
            target/ci-vm-config.json
            target/ci-vm-image.id
            target/vm-doctor.json

  static-linux:
    runs-on: ubuntu-latest
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      LZMA_API_STATIC: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain and musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Install build-time C toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static worker
        run: cargo build --release --locked -p syrox --bin syrox-worker --target x86_64-unknown-linux-musl
      - name: Embed worker in static srx
        run: cargo build --release --locked -p syrox --bin srx --target x86_64-unknown-linux-musl
        env:
          SYROX_EMBED_WORKER: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/syrox-worker
      - name: Verify static ELF and installation without distribution utilities
        run: cargo run --locked -p syrox-engine --example verify_release -- target/x86_64-unknown-linux-musl/release
      - name: Exercise static CLI and descriptor transport
        run: |
          cargo test --locked --target x86_64-unknown-linux-musl -p syrox --test cli
          cargo test --locked --target x86_64-unknown-linux-musl -p syrox-engine platform::linux::fd::transport::tests::
          cargo test --locked --target x86_64-unknown-linux-musl -p syrox-engine platform::linux::fd::terminal::tests::
          cargo test --locked --target x86_64-unknown-linux-musl -p syrox-engine execution::launcher::
          cargo test --locked --target x86_64-unknown-linux-musl -p syrox-engine execution::
          cargo test --locked --target x86_64-unknown-linux-musl -p syrox-engine acquire::https::
          cargo test --locked --target x86_64-unknown-linux-musl -p syrox-engine prepared_action_hits_before_source_acquisition_and_detects_toolchain_changes
