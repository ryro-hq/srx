name: Rust setup
description: Use the runner CPUs and cache Cargo outputs for the selected job family.
inputs:
  cache-key:
    description: Separate incompatible target and feature builds.
    required: true
  save-cache:
    description: Publish this cache family from the default branch's designated producer.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Configure compiler parallelism
      shell: bash
      run: |
        echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
        echo "RUST_TEST_THREADS=1" >> "$GITHUB_ENV"
        nproc
        free -h
        rustup show active-toolchain
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: . -> target/cargo
        shared-key: syrox-${{ inputs.cache-key }}
        cache-workspace-crates: 'false'
        cache-on-failure: 'false'
        save-if: ${{ inputs.save-cache == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env-vars: CARGO CC CFLAGS CXX CMAKE RUST LZMA
