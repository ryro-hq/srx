[workspace]
resolver = "3"
members = [
    "crates/syrox",
    "crates/syrox-engine",
    "crates/syrox-lang",
    "tools/xtask",
    "fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/ryro-hq/srx"

[workspace.dependencies]
syrox-lang = { version = "0.1.0", path = "crates/syrox-lang" }
syrox-engine = { version = "0.1.0", path = "crates/syrox-engine" }
ariadne = "0.6.0"
clap = { version = "4.6.6", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
thiserror = "2.0.20"
sha2 = { version = "=0.11.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Cohesive operations retain their resource owners through preparation, execution
# and settlement. Length alone does not identify a separate responsibility.
too_many_lines = "allow"
# Domain-qualified public type names stay readable when imported without the module.
module_name_repetitions = "allow"
# Public API return values have different ownership/effect contracts; annotate those
# that require consumption locally rather than marking every accessor must_use.
must_use_candidate = "allow"
# Fallible domain APIs document invariants and error variants at their owners;
# require substantive contracts instead of repeating mechanical Errors sections.
missing_errors_doc = "allow"
# Internal invariant assertions are documented with their owning domain contract.
missing_panics_doc = "allow"

# Authentication repeatedly hashes retained inputs under fixed startup budgets.
# Keep the crypto implementation optimized in development as in release builds.
[profile.dev.package."sha2:0.10.9"]
opt-level = 3

[profile.test.package."sha2:0.10.9"]
opt-level = 3

# Keep local preparation within the minimum product environment.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
