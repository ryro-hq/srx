[package]
name = "syrox-system"
description = "Linux system contracts and observation independent of the Syrox language and builder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "syrox-system-helper"
path = "src/helper/main.rs"

[dependencies]
syrox-encoding.workspace = true
thiserror.workspace = true
sha2.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
libc = "=1.0.0-alpha.5"

[dev-dependencies]
tempfile = "=3.27.0"
base64 = "=0.23.1"
flate2 = "=1.1.11"

[lints]
workspace = true
