[package]
name = "syrox"
description = "The Syrox package manager command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["vm-tests"]
# Host/guest harness selection; the default test run requires the microVM.
vm-tests = []
vm-guest = []
ecosystem-tests = ["vm-tests"]

[dependencies]
clap.workspace = true
syrox-engine.workspace = true
signal-hook = { version = "=0.4.4", default-features = false }
sha2.workspace = true
syrox-lang.workspace = true
serde_json = "1.0"
url = "=2.5.8"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=1.0.0-alpha.4"
tempfile = "=3.23.0"

[dev-dependencies]
microsandbox = { version = "=0.7.3", default-features = false, features = ["local", "net"] }
flate2 = "=1.1.9"
tempfile = "=3.23.0"
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "signal", "macros"] }

[lints]
workspace = true

[[bin]]
name = "srx"
path = "src/main.rs"

[[bin]]
name = "syrox-worker"
path = "src/worker.rs"

[[test]]
name = "vm"
path = "tests/vm.rs"
harness = false
required-features = ["vm-tests"]

[[test]]
name = "ecosystem"
path = "tests/ecosystem.rs"
harness = false
required-features = ["ecosystem-tests"]

[[test]]
name = "vm_guest"
path = "tests/vm_guest.rs"
harness = false
required-features = ["vm-guest"]

[[example]]
name = "verify_vm_harness"
required-features = ["vm-tests"]
